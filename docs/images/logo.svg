<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle container clipping -->
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Linear Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-iris" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="amber-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#090d16" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-410
        355,-205
        355,205
        0,410
        -355,205
        -355,-205
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Accent Dashed Hexagon -->
      <polygon points="
        0,-375
        324,-187
        324,187
        0,375
        -324,187
        -324,-187
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- ======================================================== -->
      <!-- 100% WATERTIGHT SOLID SILHOUETTE (SENTINEL OWL)          -->
      <!-- ======================================================== -->
      <path d="
        M 0,-215
        L 45,-215
        L 155,-310
        L 145,-180
        L 230,-120
        L 270,30
        L 225,180
        L 170,290
        L 75,340
        L 0,365
        L -75,340
        L -170,290
        L -225,180
        L -270,30
        L -230,-120
        L -145,-180
        L -155,-310
        L -45,-215
        Z
      " fill="#090d16" />

      <!-- ======================================================== -->
      <!-- LOW-POLY FACETS: CROWN & EAR TUFTS                      -->
      <!-- ======================================================== -->
      <!-- Left Ear Tuft -->
      <polygon points="-155,-310 -45,-215 -75,-165 -145,-180" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="-155,-310 -75,-165 -135,-140" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="-155,-310 -135,-140 -200,-150" fill="#0f172a" stroke="#090d16" stroke-width="2" />

      <!-- Right Ear Tuft (Symmetrical Volumetric Lighting) -->
      <polygon points="155,-310 45,-215 75,-165 145,-180" fill="#475569" stroke="#090d16" stroke-width="2" />
      <polygon points="155,-310 75,-165 135,-140" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="155,-310 135,-140 200,-150" fill="#1e293b" stroke="#090d16" stroke-width="2" />

      <!-- Forehead Central Keystone & Brow -->
      <polygon points="0,-215 -45,-215 -75,-165 0,-130" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="0,-215 45,-215 75,-165 0,-130" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="0,-130 -75,-165 -45,-90 0,-70" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="0,-130 75,-165 45,-90 0,-70" fill="#475569" stroke="#090d16" stroke-width="2" />

      <!-- Outer Brow Ridges -->
      <polygon points="-75,-165 -145,-180 -230,-120 -150,-100" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="75,-165 145,-180 230,-120 150,-100" fill="#334155" stroke="#090d16" stroke-width="2" />

      <!-- ======================================================== -->
      <!-- PREDATORY ALMOND OPTICAL LENS EYES                      -->
      <!-- ======================================================== -->
      <!-- Left Eye Faceted Socket -->
      <polygon points="-150,-100 -145,-55 -105,-15 -55,-15 -45,-55 -45,-90 -95,-110" fill="#0f172a" stroke="#090d16" stroke-width="2" />
      <!-- Left Slanted Almond Eye Body -->
      <polygon points="-140,-60 -115,-30 -65,-30 -50,-65 -90,-85" fill="#090d16" stroke="#00f5ff" stroke-width="2.5" />
      <!-- Left Optical Aperture Polygon -->
      <polygon points="-130,-58 -112,-36 -72,-36 -60,-62 -92,-78" fill="url(#cyan-iris)" />
      <!-- Left Focused Vertical Pupil -->
      <polygon points="-95,-74 -88,-55 -95,-38 -100,-55" fill="#060911" />
      <!-- Left Catchlight Reflection -->
      <polygon points="-90,-68 -86,-58 -90,-52 -93,-58" fill="#ffffff" opacity="0.95" />

      <!-- Right Eye Faceted Socket (Symmetrical) -->
      <polygon points="150,-100 145,-55 105,-15 55,-15 45,-55 45,-90 95,-110" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <!-- Right Slanted Almond Eye Body -->
      <polygon points="140,-60 115,-30 65,-30 50,-65 90,-85" fill="#090d16" stroke="#00f5ff" stroke-width="2.5" />
      <!-- Right Optical Aperture Polygon -->
      <polygon points="130,-58 112,-36 72,-36 60,-62 92,-78" fill="url(#cyan-iris)" />
      <!-- Right Focused Vertical Pupil -->
      <polygon points="95,-74 100,-55 95,-38 88,-55" fill="#060911" />
      <!-- Right Catchlight Reflection -->
      <polygon points="90,-68 93,-58 90,-52 86,-58" fill="#ffffff" opacity="0.95" />

      <!-- Facial Disc Lateral Outer Cheeks -->
      <polygon points="-150,-100 -230,-120 -255,-20 -175,-15" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="150,-100 230,-120 255,-20 175,-15" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="-175,-15 -255,-20 -270,30 -195,65" fill="#0f172a" stroke="#090d16" stroke-width="2" />
      <polygon points="175,-15 255,-20 270,30 195,65" fill="#1e293b" stroke="#090d16" stroke-width="2" />

      <!-- Under-eye Cheek Fillers (Eliminating flat black holes) -->
      <polygon points="-105,-15 -175,-15 -195,65 -115,50" fill="#162032" stroke="#090d16" stroke-width="2" />
      <polygon points="105,-15 175,-15 195,65 115,50" fill="#243144" stroke="#090d16" stroke-width="2" />

      <!-- ======================================================== -->
      <!-- PREDATORY AMBER BEAK (CENTRAL FOCAL POINT)              -->
      <!-- ======================================================== -->
      <!-- Nasal Bridge -->
      <polygon points="0,-70 -30,-45 0,-25" fill="#b45309" stroke="#090d16" stroke-width="2" />
      <polygon points="0,-70 30,-45 0,-25" fill="#d97706" stroke="#090d16" stroke-width="2" />
      <!-- Upper Beak Core -->
      <polygon points="0,-25 -24,-20 0,40" fill="#d97706" stroke="#090d16" stroke-width="2" />
      <polygon points="0,-25 24,-20 0,40" fill="url(#amber-beak)" stroke="#090d16" stroke-width="2" />
      <!-- Lower Beak Hook -->
      <polygon points="0,40 -12,20 0,55" fill="#92400e" stroke="#090d16" stroke-width="1.5" />
      <polygon points="0,40 12,20 0,55" fill="#b45309" stroke="#090d16" stroke-width="1.5" />

      <!-- Throat & Chin Facets -->
      <polygon points="-24,-20 -55,-15 -115,50 0,75 0,40" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="24,-20 55,-15 115,50 0,75 0,40" fill="#334155" stroke="#090d16" stroke-width="2" />

      <!-- ======================================================== -->
      <!-- BREASTPLATE: STORAGE CYLINDERS & CHEVRON DATA TRACKS    -->
      <!-- ======================================================== -->
      <!-- Tier 1 Chevron Plate -->
      <polygon points="0,75 -115,50 -130,120 0,150" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="0,75 115,50 130,120 0,150" fill="#334155" stroke="#090d16" stroke-width="2" />
      <!-- Cyan Data Track Line 1 -->
      <polyline points="-115,115 0,145 115,115" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.85" />

      <!-- Tier 2 Chevron Plate -->
      <polygon points="0,150 -130,120 -115,195 0,225" fill="#121b2a" stroke="#090d16" stroke-width="2" />
      <polygon points="0,150 130,120 115,195 0,225" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <!-- Cyan Data Track Line 2 -->
      <polyline points="-105,190 0,220 105,190" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.85" />

      <!-- Tier 3 Chevron Plate -->
      <polygon points="0,225 -115,195 -85,275 0,295" fill="#0c121d" stroke="#090d16" stroke-width="2" />
      <polygon points="0,225 115,195 85,275 0,295" fill="#121b2a" stroke="#090d16" stroke-width="2" />
      <!-- Cyan Data Track Line 3 -->
      <polyline points="-75,268 0,290 75,268" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.85" />

      <!-- Flank Connectors -->
      <polygon points="-115,50 -195,65 -185,150 -130,120" fill="#121b2a" stroke="#090d16" stroke-width="2" />
      <polygon points="115,50 195,65 185,150 130,120" fill="#1a2536" stroke="#090d16" stroke-width="2" />
      <polygon points="-130,120 -185,150 -160,220 -115,195" fill="#0d1420" stroke="#090d16" stroke-width="2" />
      <polygon points="130,120 185,150 160,220 115,195" fill="#141c2a" stroke="#090d16" stroke-width="2" />
      <polygon points="-115,195 -160,220 -120,270 -85,275" fill="#090d16" stroke="#090d16" stroke-width="2" />
      <polygon points="115,195 160,220 120,270 85,275" fill="#0e1522" stroke="#090d16" stroke-width="2" />

      <!-- Bottom Tail & Perch Diamond -->
      <polygon points="0,295 -85,275 -50,335 0,360" fill="#080c14" stroke="#090d16" stroke-width="2" />
      <polygon points="0,295 85,275 50,335 0,360" fill="#0d131f" stroke="#090d16" stroke-width="2" />
      <!-- Central Tail Keystone Accent -->
      <polygon points="0,295 -30,325 0,355 30,325" fill="url(#cyan-glow)" opacity="0.9" />

      <!-- ======================================================== -->
      <!-- WINGS & MANTLE ARMOR PLATES                             -->
      <!-- ======================================================== -->
      <!-- Left Outer Wing -->
      <polygon points="-195,65 -270,30 -255,120 -185,150" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="-185,150 -255,120 -225,180 -160,220" fill="#121b2a" stroke="#090d16" stroke-width="2" />
      <polygon points="-160,220 -225,180 -170,290 -120,270" fill="#0a0f18" stroke="#090d16" stroke-width="2" />
      <polygon points="-120,270 -170,290 -75,340 -50,335" fill="#060911" stroke="#090d16" stroke-width="2" />

      <!-- Right Outer Wing (Symmetrical) -->
      <polygon points="195,65 270,30 255,120 185,150" fill="#334155" stroke="#090d16" stroke-width="2" />
      <polygon points="185,150 255,120 225,180 160,220" fill="#1e293b" stroke="#090d16" stroke-width="2" />
      <polygon points="160,220 225,180 170,290 120,270" fill="#121b2a" stroke="#090d16" stroke-width="2" />
      <polygon points="120,270 170,290 75,340 50,335" fill="#0a0f18" stroke="#090d16" stroke-width="2" />

    </g>
  </g>
</svg>